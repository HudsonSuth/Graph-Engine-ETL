name: test

on:
  push:
  pull_request:

jobs:
  test:
    name: npm test (Node 24, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: streamgraph
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: streamgraph/package-lock.json
      - run: npm ci
      - run: npm test

# Flink processor logging: WARN+ to the log file, ERROR to stderr. stdout is reserved for the one-line JSON status.
rootLogger.level = WARN
rootLogger.appenderRef.file.ref = File
rootLogger.appenderRef.err.ref = Err
appender.file.name = File
appender.file.type = File
appender.file.fileName = ${sys:log.file}
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %c{1} - %m%n
appender.err.name = Err
appender.err.type = Console
appender.err.target = SYSTEM_ERR
appender.err.layout.type = PatternLayout
appender.err.layout.pattern = [flink] %-5p %c{1} - %m%n
appender.err.filter.threshold.type = ThresholdFilter
appender.err.filter.threshold.level = ERROR
logger.ckpt.name = org.apache.flink.runtime.checkpoint.CheckpointCoordinator
logger.ckpt.level = INFO
